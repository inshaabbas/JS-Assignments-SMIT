<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaStore</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Navbar Start -->
  <nav class="navbar navbar-expand-lg glass-nav">
    <div class="container-xxl d-flex justify-content-between align-items-center">
      <a class="navbar-brand text-white fw-bold fs-3" href="#">NovaStore</a>
      <form class="d-flex" role="search">
        <input class="form-control me-2 search-input" oninput="searchInput(this.value)" type="search"
          placeholder="Search product..." aria-label="Search" />
      </form>
    </div>
  </nav>
  <!-- Navbar End -->

  <!-- Hero Section starts -->
  <section class="hero-section text-center text-white py-5">
    <div class="container">
      <h1 class="fw-bold display-5">Discover Products with Style ✨</h1>
      <p class="lead">Search and explore premium products across all categories.</p>
    </div>
  </section>
  <!-- Hero Section Ends -->

  <!-- Product Section Starts -->
  <div id="productContainer" class="container-xxl d-flex justify-content-center flex-wrap gap-4 py-5"></div>
  <!-- Product Section Ends -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- External JS -->
  <script src="index.js"></script>
</body>

</html>
