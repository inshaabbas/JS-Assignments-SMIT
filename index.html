<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider</title>
  <!-- Font awesome cdn -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <h1>Whisk and Wonder</h1>
  <div class="slider">
    <img id="silderImage" src="https://static.vecteezy.com/system/resources/thumbnails/001/971/264/small_2x/beautiful-cherry-blossom-with-bokeh-lights-background-concept-free-vector.jpg" alt="Image">

    <div class="right-arrow" onclick="next()">
      <i class="fa-solid fa-angle-right"></i>
    </div>

    <div class="left-arrow" onclick="prev()">
      <i class="fa-solid fa-angle-left"></i>
    </div>
  </div>

  <div class="image-bottom">
    <img src="./Assets/Brownie.jpeg" alt="Slide 1">
    <img src="./Assets/Cookies.jpeg" alt="Slide 2">
    <img src="./Assets/Cupcake.png" alt="Slide 3">
    <img src="./Assets/Donut.jpeg" alt="Slide 3">
    <img src="./Assets/Pancake.png" alt="Slide 3">
    <img src="./Assets/Red-Velvet-Cake.jpeg" alt="Slide 3">
    <img src="./Assets/Waffle.jpeg" alt="Slide 3">
  </div>

  <script src="./index.js"></script>
</body>

</html>
